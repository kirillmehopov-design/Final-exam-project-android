services:
  - type: web
    name: sneakerhub-api-demo
    runtime: python
    plan: free
    branch: feature/final-rubric-100
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: SNEAKERHUB_OTP_SECRET
        generateValue: true
