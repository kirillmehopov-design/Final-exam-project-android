name: Final from Lab 11 - fullstack checks

on:
  push:
    branches: [feature/final-from-lab11, feature/final-v2-redesign]
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Web scaffolding
        run: flutter create --platforms=android,web .
      - name: Install packages
        run: flutter pub get
      - name: Generate original SneakerHub icon and splash assets
        run: python tooling/create_brand_icon.py
      - name: Generate platform app icons
        run: dart run flutter_launcher_icons
      - name: Generate native and web splash screens
        run: dart run flutter_native_splash:create
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
      - name: Pack full Android-Web project
        run: zip -q -r SneakerHub-Final-Redesign.zip . -x '.git/*' 'build/*' '.dart_tool/*' '.venv/*' '*.sqlite3' '.idea/*'
      - uses: actions/upload-artifact@v4
        with:
          name: SneakerHub-Final-Redesign-Android-Web
          path: SneakerHub-Final-Redesign.zip
          if-no-files-found: error
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Test FastAPI / SQLite end-to-end flows
        run: python -m pytest backend/tests -q
